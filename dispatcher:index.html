<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#14181C">
<title>ТОЧКА — Диспетчер</title>
<style>
:root{--bg:#14181C;--panel:#1E252B;--line:#2E3840;--txt:#F2F4F5;--mut:#8A949C;--amb:#FFB300;--grn:#3DDC84;--red:#FF5A4F;
--f:"Bahnschrift","Segoe UI",system-ui,-apple-system,Roboto,sans-serif}
*,*::before,*::after{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--txt);font-family:var(--f);font-size:16px;line-height:1.3;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0);-webkit-tap-highlight-color:transparent}
.wrap{max-width:760px;margin:0 auto;padding:14px 14px 40px;display:flex;flex-direction:column;gap:14px}
button,input{font:inherit;color:inherit}
button{border-radius:12px;cursor:pointer;background:var(--panel);border:2px solid var(--line);min-height:44px;padding:0 14px}
button:focus-visible,input:focus-visible,.bus:focus-visible{outline:3px solid var(--amb);outline-offset:2px}
.head{display:flex;align-items:center;gap:10px}
.head h1{font-size:24px;flex:1}
.dot{width:12px;height:12px;border-radius:50%;background:var(--amb);box-shadow:0 0 0 4px rgba(255,179,0,.25)}
.primary{background:var(--amb);border-color:var(--amb);color:#14181C;font-weight:700}
.sum{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.sum div{background:var(--panel);border-radius:12px;padding:10px 6px;text-align:center}
.sum b{display:block;font-size:26px;line-height:1.1;font-variant-numeric:tabular-nums}
.sum span{font-size:12px;color:var(--mut)}
.sum .bad b{color:var(--red)}
.sec{font-size:14px;color:var(--mut);margin-bottom:6px}
.alert{display:flex;align-items:center;gap:10px;background:#3A1A18;border:2px solid var(--red);border-radius:12px;padding:8px 10px;margin-bottom:6px}
.alert p{flex:1;min-width:0}
.alert small{display:block;color:var(--mut)}
.alert button{min-height:40px;padding:0 10px;font-size:14px}
.filters{display:flex;gap:6px;overflow-x:auto}
.filters button{min-height:38px;border-radius:99px;font-size:14px;white-space:nowrap}
.filters button[aria-pressed=true]{background:var(--amb);border-color:var(--amb);color:#14181C;font-weight:700}
.list{display:grid;gap:8px}
.bus{display:flex;align-items:center;gap:12px;background:var(--panel);border:2px solid var(--line);border-left:8px solid var(--amb);border-radius:14px;padding:10px 12px;cursor:pointer}
.bus.stand{border-left-color:var(--grn)}.bus.brk{border-left-color:var(--mut)}.bus.late{border-left-color:var(--red);border-color:var(--red)}
.badge{background:var(--amb);color:#14181C;font-weight:800;font-size:22px;border-radius:10px;min-width:48px;text-align:center;padding:2px 6px}
.mid{flex:1;min-width:0}
.mid b{font-size:17px}
.live{font-size:11px;color:var(--grn);border:1px solid var(--grn);border-radius:99px;padding:1px 7px;margin-left:6px;vertical-align:2px}
.st{color:var(--mut);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bus.late .st{color:var(--red);font-weight:700}
.bus.stand .st{color:var(--grn)}
.bar{height:5px;border-radius:3px;background:var(--line);margin-top:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--amb)}
.load{font-size:13px;border-radius:99px;padding:3px 9px;border:1px solid var(--line);color:var(--mut);white-space:nowrap}
.l1{color:var(--amb);border-color:var(--amb)}.l2{color:var(--red);border-color:var(--red)}
.empty{color:var(--mut);text-align:center;padding:24px 0}
#ov{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:flex-end;justify-content:center;z-index:10}
#ov.open{display:flex}
.sheet{width:100%;max-width:760px;max-height:88dvh;overflow:auto;background:var(--panel);border-radius:18px 18px 0 0;padding:16px 14px calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px}
.sheet h2{font-size:20px}
.hist{list-style:none;padding:0;display:grid;gap:4px;font-size:14px;color:var(--mut)}
.hist li b{color:var(--txt);font-weight:400}
.hist .me b{color:var(--amb)}
.quick{display:flex;flex-wrap:wrap;gap:6px}
.quick button{min-height:40px;font-size:14px;border-radius:99px}
.send{display:flex;gap:8px}
.send input{flex:1;min-width:0;height:48px;background:var(--bg);border:2px solid var(--line);border-radius:12px;padding:0 12px}
.send button{height:48px}
#toast{position:fixed;left:16px;right:16px;top:calc(10px + env(safe-area-inset-top,0));max-width:420px;margin:0 auto;background:#fff;color:#14181C;border-radius:12px;padding:10px 14px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s;z-index:30}
#toast.on{opacity:1}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
.lines{margin-top:6px}
.ln{background:var(--panel);border-radius:12px;padding:10px 12px;margin-bottom:8px}
.m2{color:var(--mut);font-size:13px}.m2.bad{color:var(--red);font-weight:700}
.trk{position:relative;height:26px;margin:8px 8px 4px}
.trk::before{content:"";position:absolute;left:0;right:0;top:12px;height:2px;background:var(--line)}
.trk i{position:absolute;top:5px;width:16px;height:16px;margin-left:-8px;border-radius:50%;border:2px solid var(--bg)}
</style>
</head>
<body>
<main class="wrap">
  <div class="head"><span class="dot"></span><h1>Диспетчер</h1><button id="all" class="primary">Всем водителям</button></div>
  <div class="sum" id="sum"></div>
  <div id="alertBox"></div>
  <div class="filters" id="flt">
    <button data-f="all" aria-pressed="true">Все</button><button data-f="warn" aria-pressed="false">Внимание</button>
    <button data-f="stand" aria-pressed="false">На стоянке</button><button data-f="brk" aria-pressed="false">Перерыв</button>
  </div>
  <div class="list" id="list"></div>
  <div class="lines" id="lines"></div>
</main>

<div id="ov"><div class="sheet">
  <h2 id="shT"></h2><div class="st" id="shS" style="white-space:normal"></div>
  <div><div class="sec">Последние события</div><ul class="hist" id="shH"></ul></div>
  <div><div class="sec">Быстрое сообщение</div><div class="quick" id="quick"></div></div>
  <div class="send"><input id="msg" placeholder="Своё сообщение" maxlength="140" enterkeyhint="send"><button id="sendBtn" class="primary">Отправить</button></div>
</div></div>
<div id="toast" role="status" aria-live="polite"></div>

<script>
// Демо-данные, как в приложении водителя. layover — стоянка на конечной, секунды
const ROUTES={
  '6':{name:"Марьино — Главпочтамт",layover:180,stops:["Марьино", "Студенческий городок", "Автовокзал", "РКБ имени Семашко", "площадь Куйбышева", "Московская площадь", "6-я городская больница", "Железнодорожный вокзал", "Главпочтамт"]},
  '16':{name:"Марьино — РКБ Семашко",layover:180,stops:["Марьино", "Больничный городок", "Гостиница «Москва»", "Автовокзал", "РКБ имени Семашко", "площадь Куйбышева", "Московская площадь", "рынок Привоз"]},
  '61':{name:"Агроуниверситет — Пневматика",layover:180,stops:["Агроуниверситет", "Московская площадь", "Железнодорожный вокзал", "улица Павленко", "Завод «Пневматика»"]},
  '62':{name:"Пневматика — Загородный",layover:180,stops:["Завод «Пневматика»", "Балаклавский рынок", "парк имени Тренёва", "площадь Ленина", "Главпочтамт", "Художественный музей", "Медицинский институт", "Железнодорожный вокзал", "6-я городская больница", "Московская площадь", "Загородный"]}};
// Расписание (демо-значения, замените реальными): первый/последний рейс и интервалы, мин
var SCHED={def:{first:'05:40',last:'21:50',peak:6,off:10},'6':{first:'05:30',last:'22:00',peak:8,off:12},'16':{first:'05:45',last:'21:30',peak:9,off:14}};
function schedOf(rn){return SCHED[rn]||SCHED.def}
function hmToMin(s){var p=s.split(':');return +p[0]*60+ +p[1]}
function headwayMin(rn,min){var h=min/60,sc=schedOf(rn);return((h>=7&&h<9.5)||(h>=16.5&&h<19))?sc.peak:sc.off}
function departures(rn,dir,day){var sc=schedOf(rn),t=hmToMin(sc.first)+(dir?Math.round(sc.off/2):0),end=hmToMin(sc.last),a=[];while(t<=end){a.push(day+t*60000);t+=headwayMin(rn,t)}return a}
function nextDeparture(rn,dir,after){var d0=new Date(after);d0.setHours(0,0,0,0);var day=d0.getTime();
  for(var k=0;k<2;k++){var L=departures(rn,dir,day+k*86400000);for(var i=0;i<L.length;i++)if(L[i]>=after)return L[i]}return null}
function hm(ts){return new Date(ts).toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'})}
const DK='krymtrack:driver', MK='krymtrack:dispatch';
const LOADS=['Свободно','Есть места','Битком'];
const QUICK=['Держите интервал 3 минуты','Отстаёте от графика, ускорьтесь','Подождите на конечной ещё 2 минуты','Сообщите обстановку на линии'];
const $=id=>document.getElementById(id);
const rnd=(a,b)=>a+Math.random()*(b-a);
let filter='all', target=null, alerts=[], hist={}, seenReal=Date.now()-600000, lateReal=0;

function toast(t){const el=$('toast');el.textContent=t;el.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.remove('on'),2200)}
function fmt(s){s=Math.max(0,s);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}
function ago(t){const s=Math.round((Date.now()-t)/1000);return s<60?'только что':s<3600?Math.floor(s/60)+' мин назад':new Date(t).toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'})}
const stopsOf=b=>{const s=ROUTES[b.route].stops;return b.dir?s.slice().reverse():s};

// --- Автобусы: 4 демо-машины двигаются сами, живой автобус берётся из приложения водителя ---
const SIM=[['Т101РТ 82','6',false,3],['Т102РТ 82','6',false,4],['Т103РТ 82','6',true,5],['Т201КМ 82','16',false,3],['А204ВС 82','61',false,2],['К771МН 82','62',true,6]].map(([plate,route,dir,idx],i)=>
  ({id:'s'+i,plate,route,dir,idx,phase:'run',standEnd:0,sched:Date.now(),dep:Date.now(),status:'line',load:Math.floor(rnd(0,3)),log:[],nextAt:Date.now()+rnd(3000,12000),lateFor:0}));
function logSim(b,text){b.log.push({t:Date.now(),text})}
function planStand(b,now){
  let s=nextDeparture(b.route,b.dir?1:0,now+90000);
  b.offSched=!s||s-now>40*60000;if(b.offSched)s=now+ROUTES[b.route].layover*1000;
  b.sched=s;b.standEnd=s;
}
function simStep(b){
  const now=Date.now(); if(now<b.nextAt)return;
  const n=ROUTES[b.route].stops.length, next=()=>b.nextAt=now+rnd(15000,30000);
  if(b.status==='break'){b.status='line';logSim(b,'Вернулся на линию');return next()}
  if(b.phase==='stand'){b.phase='run';b.dep=now;logSim(b,'Выезд с конечной');return next()}
  if(b.idx>=n-1){
    b.dir=!b.dir;b.idx=1;b.phase='stand';b.load=0;planStand(b,now);
    b.nextAt=b.sched+(Math.random()<.3?rnd(60000,240000):0);logSim(b,'Прибыл на конечную');return}
  logSim(b,'Прибытие: '+stopsOf(b)[b.idx]);b.idx++;
  b.load=Math.max(0,Math.min(2,b.load+(Math.random()<.5?1:-1)*(Math.random()<.5?1:0)));
  if(Math.random()<.07)addAlert(b,['Пробка','Задержка'][Math.floor(rnd(0,2))],now);
  else if(Math.random()<.04){b.status='break';logSim(b,'Ушёл на перерыв');return b.nextAt=now+25000}
  next();
}
function readReal(){let s=null;try{s=JSON.parse(localStorage.getItem(DK))}catch(e){}return s&&s.active&&ROUTES[s.route]?s:null}
function fleet(){
  const r=readReal(), a=SIM.slice();
  if(r)a.unshift({id:'real',real:true,plate:r.bus,route:r.route,dir:r.dir,idx:r.idx,phase:r.phase,standEnd:r.standEnd,status:r.status,load:r.load,sched:r.sched,dep:r.dep,offSched:r.offSched,log:(r.log||[]).map(e=>({t:e.t,text:e.text.replace('Диспетчеру отправлено: ','Водитель: ')}))});
  return a;
}
function addAlert(b,text,t){alerts.push({id:t+b.plate,plate:b.plate,text,t});beep()}
function beep(){if(navigator.vibrate)navigator.vibrate(150)}
function pollAlerts(){
  const r=readReal();
  if(r){
    (r.log||[]).forEach(e=>{if(e.type==='report'&&e.t>seenReal)addAlert({plate:r.bus},e.text.replace('Диспетчеру отправлено: ',''),e.t)});
    seenReal=Math.max(seenReal,...(r.log||[]).map(e=>e.t),0);
    if(r.phase==='stand'&&Date.now()>r.standEnd&&lateReal!==r.standEnd){lateReal=r.standEnd;addAlert({plate:r.bus},'Задерживает выезд с конечной',Date.now())}
  }
  SIM.forEach(b=>{if(b.phase==='stand'&&Date.now()>b.standEnd&&b.lateFor!==b.standEnd){b.lateFor=b.standEnd;addAlert(b,'Задерживает выезд с конечной',Date.now())}});
}
function delayMin(b){return b.dep&&b.sched&&!b.offSched?Math.round((b.dep-b.sched)/60000):0}
function info(b){
  const list=stopsOf(b),n=list.length,now=Date.now();
  if(b.status==='break')return {cls:'brk',txt:'Перерыв · пассажиры не видят автобус',bar:0,warn:false};
  if(b.phase==='stand'){const left=Math.round((b.standEnd-now)/1000),at=' · отпр. '+hm(b.sched||b.standEnd);
    return left<0?{cls:'late',txt:'Задерживает выезд +'+fmt(-left)+' · '+list[0],bar:0,warn:true}
                 :{cls:'stand',txt:'Стоянка '+fmt(left)+' · '+list[0]+at,bar:0,warn:false}}
  const d=delayMin(b),tag=b.offSched?'':d>=2?' · +'+d+' мин к графику':d<=-2?' · раньше на '+(-d)+' мин':' · по графику';
  return {cls:d>=3?'late':'',txt:'Едет → '+list[b.idx]+tag,bar:Math.round((b.idx-1)/(n-1)*100),warn:d>=3};
}
function renderLines(f){
  const by={};f.forEach(b=>(by[b.route]=by[b.route]||[]).push(b));
  const nm=new Date(),min=nm.getHours()*60+nm.getMinutes();
  $('lines').innerHTML='<div class="sec">Интервалы по маршрутам</div>'+Object.keys(by).map(rn=>{
    const r=ROUTES[rn],n=r.stops.length,bs=by[rn],norm=headwayMin(rn,min),trip=(n-1)*3;
    const pos=b=>{const p=b.phase==='stand'?0:(b.idx-1)/(n-1);return b.dir?1-p:p};
    const dots=bs.map(b=>{const i=info(b),c=i.cls==='late'?'var(--red)':i.cls==='stand'?'var(--grn)':i.cls==='brk'?'var(--mut)':'var(--amb)';return `<i title="${b.plate}" style="left:${(pos(b)*100).toFixed(1)}%;background:${c}"></i>`}).join('');
    let msg='',bad=false;
    [false,true].forEach(dir=>{const g=bs.filter(b=>!!b.dir===dir&&b.status!=='break'&&b.phase!=='stand').map(b=>(b.idx-1)/(n-1)).sort((a,c)=>a-c);
      for(let k=1;k<g.length;k++){const gap=(g[k]-g[k-1])*trip,flag=gap<norm*.4?' — кучей':gap>norm*1.8?' — окно':'';if(flag)bad=true;msg+=(msg?' · ':'')+Math.round(gap)+' мин'+flag}});
    return `<div class="ln"><b>№${rn}</b> <span class="m2">${r.name}</span><div class="trk">${dots}</div><div class="m2${bad?' bad':''}">${msg?'Интервалы: '+msg+' (норма '+norm+' мин)':'Норма '+norm+' мин · на линии: '+bs.length}</div></div>`}).join('');
}
const hasAlert=b=>alerts.some(a=>a.plate===b.plate);

// --- Экран ---
function render(){
  const f=fleet(), inf=f.map(info);
  const cnt={line:0,stand:0,brk:0};
  f.forEach((b,i)=>{if(b.status==='break')cnt.brk++;else if(b.phase==='stand')cnt.stand++;else cnt.line++});
  $('sum').innerHTML=`<div><b>${cnt.line}</b><span>на линии</span></div><div><b>${cnt.stand}</b><span>на стоянке</span></div><div><b>${cnt.brk}</b><span>перерыв</span></div><div class="${alerts.length?'bad':''}"><b>${alerts.length}</b><span>внимание</span></div>`;
  $('alertBox').innerHTML=alerts.length?'<div class="sec">Требует внимания</div>'+alerts.slice(-3).reverse().map(a=>`<div class="alert"><p><b>${a.plate}</b> · ${a.text}<small>${ago(a.t)}</small></p><button data-w="${a.plate}">Написать</button><button data-ok="${a.id}">Принято</button></div>`).join(''):'';
  let rows=f.map((b,i)=>({b,i:inf[i]})).filter(({b,i})=>filter==='all'||(filter==='warn'&&(i.warn||hasAlert(b)))||(filter==='stand'&&i.cls==='stand')||(filter==='brk'&&i.cls==='brk'));
  rows.sort((x,y)=>(y.i.warn||hasAlert(y.b))-(x.i.warn||hasAlert(x.b)));
  $('list').innerHTML=rows.length?rows.map(({b,i})=>`<article class="bus ${i.cls}" data-id="${b.id}" role="button" tabindex="0"><div class="badge">${b.route}</div><div class="mid"><b>${b.plate}</b>${b.real?'<span class="live">живой</span>':''}<div class="st">${i.txt}</div><div class="bar"><i style="width:${i.bar}%"></i></div></div><span class="load l${b.load}">${LOADS[b.load]}</span></article>`).join(''):'<p class="empty">В этой категории автобусов нет</p>';
  renderLines(f);
  if($('ov').classList.contains('open'))renderSheet();
}
function renderSheet(){
  const b=target==='all'?null:fleet().find(x=>x.plate===target);
  if(target!=='all'&&!b){closeSheet();return}
  $('shT').textContent=b?b.plate+' · маршрут '+b.route:'Сообщение всем водителям';
  $('shS').textContent=b?info(b).txt+' · '+LOADS[b.load]:'Получат все, кто сейчас на смене';
  const ev=(b?b.log:[]).concat(b?(hist[b.plate]||[]):[]).sort((x,y)=>y.t-x.t).slice(0,7);
  $('shH').innerHTML=ev.length?ev.map(e=>`<li class="${e.me?'me':''}">${ago(e.t)} · <b>${e.text}</b></li>`).join(''):'<li>Пока нет событий</li>';
}
function openSheet(t){target=t;$('msg').value='';renderSheet();$('ov').classList.add('open')}
function closeSheet(){$('ov').classList.remove('open')}
function send(text){
  text=text.trim();if(!text)return;
  let a=[];try{a=JSON.parse(localStorage.getItem(MK))||[]}catch(e){}
  a.push({id:Date.now(),to:target,text,t:Date.now()});
  try{localStorage.setItem(MK,JSON.stringify(a.slice(-30)))}catch(e){toast('Не удалось отправить');return}
  (target==='all'?fleet().map(b=>b.plate):[target]).forEach(p=>{(hist[p]=hist[p]||[]).push({t:Date.now(),text:'Вы: '+text,me:true})});
  SIM.filter(b=>target==='all'||b.plate===target).forEach(b=>setTimeout(()=>logSim(b,'Водитель принял сообщение'),3000));
  toast('Отправлено: '+(target==='all'?'всем':target));$('msg').value='';renderSheet();
}

$('quick').innerHTML=QUICK.map(q=>`<button>${q}</button>`).join('');
$('quick').onclick=e=>{if(e.target.tagName==='BUTTON')send(e.target.textContent)};
$('sendBtn').onclick=()=>send($('msg').value);
$('msg').onkeydown=e=>{if(e.key==='Enter')send($('msg').value)};
$('all').onclick=()=>openSheet('all');
$('ov').onclick=e=>{if(e.target.id==='ov')closeSheet()};
addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet()});
$('flt').onclick=e=>{const b=e.target.closest('button');if(!b)return;filter=b.dataset.f;document.querySelectorAll('#flt button').forEach(x=>x.setAttribute('aria-pressed',x===b));render()};
$('alertBox').onclick=e=>{const b=e.target.closest('button');if(!b)return;
  if(b.dataset.ok)alerts=alerts.filter(a=>a.id!==b.dataset.ok);
  if(b.dataset.w){openSheet(b.dataset.w)}render()};
$('list').onclick=e=>{const c=e.target.closest('.bus');if(c)openSheet(fleet().find(b=>b.id===c.dataset.id).plate)};
$('list').onkeydown=e=>{if(e.key==='Enter'&&e.target.classList.contains('bus'))e.target.click()};

function loop(){SIM.forEach(simStep);pollAlerts();render()}
addEventListener('storage',e=>{if(e.key===DK){pollAlerts();render()}});
loop();setInterval(loop,1000);
</script>
</body>
</html>
